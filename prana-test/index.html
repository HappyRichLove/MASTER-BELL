<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#000000">
    <title>MASTER PRANA</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">

    <style>
        *, *::before, *::after { box-sizing: border-box; }
        :root {
            --bg: #000000;
            --surface: #121214;
            --surface-card: #18181b;
            --text: #ffffff;
            --accent: #9ca3af;
            --gold: #d4af37;
            --gold-light: #fef08a;
            --gold-glow: rgba(212, 175, 55, 0.35);
            --border: rgba(212, 175, 55, 0.22);
            --danger: #ef4444;
            --success: #10b981;
        }

        body {
            margin: 0;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            overflow-y: auto;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* HEADER AREA — REFINED PROPORTIONAL BALANCE */
        .header-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding-top: clamp(16px, 3.5vh, 28px);
            padding-bottom: clamp(10px, 2vh, 18px);
            flex-shrink: 0;
        }

        .master-title {
            font-size: clamp(2.2rem, 8.5vw, 3.2rem);
            font-weight: 200;
            letter-spacing: 0.32em;
            text-indent: 0.32em;
            color: var(--text);
            text-transform: uppercase;
            text-align: center;
            margin: 0;
            opacity: 0.95;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
            line-height: 1.1;
        }

        /* ELEGANT GOLD OUTLINE BADGE WITH LUMINESCENT GLOW */
        .badge-brand {
            margin-top: 8px;
            font-size: 0.65rem;
            letter-spacing: 0.28em;
            text-indent: 0.28em;
            color: var(--gold);
            text-transform: uppercase;
            font-weight: 600;
            padding: 4px 16px;
            border-radius: 20px;
            background: rgba(212, 175, 55, 0.12);
            border: 1px solid rgba(212, 175, 55, 0.45);
            box-shadow: 0 0 16px rgba(212, 175, 55, 0.35), inset 0 0 10px rgba(212, 175, 55, 0.15);
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        /* MAIN HUB CONTAINER */
        .hub-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 420px;
            padding: 0 20px;
            gap: clamp(14px, 2.5vh, 22px);
            flex: 1;
            margin: 0 auto;
        }

        /* DUOLINGO GOLD COUNTER CARD */
        .duo-counter-card {
            width: 100%;
            background: radial-gradient(circle at center top, rgba(212, 175, 55, 0.15) 0%, rgba(18, 18, 20, 0.92) 75%);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: clamp(16px, 2.4vh, 22px) 20px clamp(14px, 2vh, 18px);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(212, 175, 55, 0.25);
            position: relative;
            overflow: hidden;
        }

        .duo-label-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .duo-sparkle {
            color: var(--gold);
            font-size: 0.85rem;
            animation: pulseSparkle 2.6s infinite ease-in-out;
        }

        @keyframes pulseSparkle {
            0%, 100% { opacity: 0.55; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.25); }
        }

        .duo-label {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--gold);
        }

        .duo-time-value {
            font-size: clamp(2.2rem, 8.5vw, 3.2rem);
            font-weight: 200;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.03em;
            color: #ffffff;
            text-shadow: 0 0 25px var(--gold-glow);
            line-height: 1.1;
        }

        /* ACTIONS HUB */
        .actions-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: clamp(10px, 1.8vh, 14px);
        }

        /* PRIMARY LOTUS BUTTON (PRANAYAMA) */
        .btn-lotus-main {
            width: 100%;
            background: linear-gradient(135deg, #2a220d 0%, #151410 100%);
            border: 1.5px solid var(--gold);
            border-radius: 22px;
            padding: clamp(14px, 2vh, 18px) 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.16);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-lotus-main:active {
            transform: scale(0.97);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
        }

        .btn-left-content {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-circle-badge {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            flex-shrink: 0;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .btn-text-col {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
        }

        .btn-primary-title {
            font-size: clamp(1.02rem, 3.8vw, 1.18rem);
            font-weight: 300;
            letter-spacing: 0.22em;
            text-indent: 0.22em;
            color: #ffffff;
            text-transform: uppercase;
            line-height: 1.2;
        }

        .btn-arrow {
            color: var(--gold);
            opacity: 0.8;
            font-size: 1.4rem;
            font-weight: 300;
        }

        /* METRONOME BUTTON (WITH SACRED STAR ICON) */
        .btn-metro-main {
            width: 100%;
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 22px;
            padding: clamp(14px, 2vh, 18px) 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-metro-main:active {
            transform: scale(0.97);
            background: #1c1c20;
            border-color: var(--border);
        }

        .btn-metro-main .icon-circle-badge {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            box-shadow: none;
        }

        /* FOOTER */
        .footer-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 8px;
            padding-bottom: max(14px, 2vh);
            gap: 4px;
            flex-shrink: 0;
        }

        .version-tag {
            font-size: 0.55rem;
            letter-spacing: 0.2em;
            color: var(--accent);
            opacity: 0.5;
            text-transform: uppercase;
        }

        /* PIN MODAL */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 99999;
            background: rgba(0, 0, 0, 0.84);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .pin-card {
            background: #141416;
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 30px 24px 26px;
            width: 100%;
            max-width: 330px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(212, 175, 55, 0.12);
            animation: modalPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        @keyframes modalPop {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .pin-close-btn {
            position: absolute;
            top: 18px;
            right: 20px;
            background: transparent;
            border: none;
            color: var(--accent);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 6px;
            line-height: 1;
        }

        .pin-lotus-badge {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.12);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            margin-bottom: 14px;
        }

        .pin-title {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: #ffffff;
            text-transform: uppercase;
            margin: 0;
        }

        .pin-desc {
            font-size: 0.68rem;
            color: var(--accent);
            margin: 6px 0 20px;
            letter-spacing: 0.05em;
        }

        /* PIN SLOTS */
        .pin-slots {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .pin-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            background: transparent;
            transition: all 0.15s ease;
        }

        .pin-dot.filled {
            background: var(--gold);
            border-color: var(--gold);
            box-shadow: 0 0 10px var(--gold);
            transform: scale(1.15);
        }

        .pin-dot.error {
            border-color: var(--danger);
            background: var(--danger);
        }

        /* KEYPAD */
        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 250px;
        }

        .key-btn {
            background: #1f1f23;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            height: 52px;
            font-size: 1.35rem;
            font-weight: 500;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .key-btn:active {
            transform: scale(0.92);
            background: var(--gold);
            color: #000000;
        }

        .key-btn.action-key {
            font-size: 1rem;
            color: var(--accent);
            background: transparent;
            border-color: transparent;
        }

        .key-btn.action-key:active {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        /* SHAKE ANIMATION */
        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 40px;
            background: rgba(24, 24, 27, 0.95);
            border: 1px solid var(--border);
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 24px;
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
            transform: translateY(10px);
            z-index: 100000;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- HEADER (CENTERED BETWEEN TOP AND TIMER) -->
    <header class="header-area">
        <h1 class="master-title">МАСТЕР</h1>
        <div class="badge-brand">PRANA</div>
    </header>

    <!-- HUB CONTENT -->
    <main class="hub-container">

        <!-- DUOLINGO MOTIVATION TIMER (mb_total) -->
        <section class="duo-counter-card">
            <div class="duo-label-row">
                <span class="duo-sparkle">✦</span>
                <span class="duo-label">ОБЩЕЕ ВРЕМЯ ПРАКТИК</span>
                <span class="duo-sparkle">✦</span>
            </div>
            <div class="duo-time-value" id="duoTotalDisplay">00:00:00</div>
        </section>

        <!-- BUTTONS HUB -->
        <section class="actions-grid">
            
            <!-- LOTUS BUTTON (PRANAYAMA) -->
            <div class="btn-lotus-main" onclick="handleLotusClick()">
                <div class="btn-left-content">
                    <div class="icon-circle-badge">
                        <!-- Sacred Lotus SVG -->
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3c-2.5 4-3.5 8-3.5 12 2.5-1 4.5-1 7 0 0-4-1-8-3.5-12z"/>
                            <path d="M8.5 15C5 13.5 3 10 3 7c4 1 6.5 4.5 7 7.5"/>
                            <path d="M15.5 15C19 13.5 21 10 21 7c-4 1-6.5 4.5-7 7.5"/>
                            <path d="M6 19.5c3.5 1.5 8.5 1.5 12 0"/>
                        </svg>
                    </div>
                    <div class="btn-text-col">
                        <span class="btn-primary-title">ПРАНАЯМА</span>
                    </div>
                </div>
                <div class="btn-arrow">›</div>
            </div>

            <!-- METRONOME BUTTON (WITH SACRED STAR) -->
            <div class="btn-metro-main" onclick="window.location.href='metronome.html'">
                <div class="btn-left-content">
                    <div class="icon-circle-badge">
                        <!-- Sacred Four-Pointed Star SVG -->
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
                        </svg>
                    </div>
                    <div class="btn-text-col">
                        <span class="btn-primary-title">МЕТРОНОМ</span>
                    </div>
                </div>
                <div class="btn-arrow">›</div>
            </div>

        </section>

    </main>

    <!-- FOOTER -->
    <footer class="footer-area">
        <div class="version-tag">MASTER PRANA v1.0.3</div>
    </footer>

    <!-- PIN CODE MODAL (888 / 3 DAYS) -->
    <div class="modal-overlay" id="pinModal" onclick="closePinModal(event)">
        <div class="pin-card" onclick="event.stopPropagation()">
            <button class="pin-close-btn" onclick="closePinModal()">✕</button>

            <div class="pin-lotus-badge">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3c-2.5 4-3.5 8-3.5 12 2.5-1 4.5-1 7 0 0-4-1-8-3.5-12z"/>
                    <path d="M8.5 15C5 13.5 3 10 3 7c4 1 6.5 4.5 7 7.5"/>
                    <path d="M15.5 15C19 13.5 21 10 21 7c-4 1-6.5 4.5-7 7.5"/>
                    <path d="M6 19.5c3.5 1.5 8.5 1.5 12 0"/>
                </svg>
            </div>

            <h2 class="pin-title">ПРАНАЯМА</h2>
            <p class="pin-desc">Введите пароль доступа</p>

            <div class="pin-slots" id="pinSlots">
                <div class="pin-dot" id="dot0"></div>
                <div class="pin-dot" id="dot1"></div>
                <div class="pin-dot" id="dot2"></div>
            </div>

            <div class="keypad-grid">
                <button class="key-btn" onclick="pressPin('1')">1</button>
                <button class="key-btn" onclick="pressPin('2')">2</button>
                <button class="key-btn" onclick="pressPin('3')">3</button>
                <button class="key-btn" onclick="pressPin('4')">4</button>
                <button class="key-btn" onclick="pressPin('5')">5</button>
                <button class="key-btn" onclick="pressPin('6')">6</button>
                <button class="key-btn" onclick="pressPin('7')">7</button>
                <button class="key-btn" onclick="pressPin('8')">8</button>
                <button class="key-btn" onclick="pressPin('9')">9</button>
                <button class="key-btn action-key" onclick="clearPin()">C</button>
                <button class="key-btn" onclick="pressPin('0')">0</button>
                <button class="key-btn action-key" onclick="backspacePin()">⌫</button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

<script>
    /* =====================================================
       LIFETIME DUOLINGO COUNTER (mb_total)
       ===================================================== */
    function formatTotalTime(totalSeconds) {
        var s = Math.max(0, parseInt(totalSeconds, 10) || 0);
        var hrs = Math.floor(s / 3600);
        var rem = s % 3600;
        var mins = Math.floor(rem / 60);
        var secs = rem % 60;

        var hStr = hrs < 10 ? '0' + hrs : '' + hrs;
        var mStr = mins < 10 ? '0' + mins : '' + mins;
        var sStr = secs < 10 ? '0' + secs : '' + secs;
        return hStr + ':' + mStr + ':' + sStr;
    }

    function renderTotalTimer() {
        var rawTotal = localStorage.getItem('mb_total') || '0';
        var el = document.getElementById('duoTotalDisplay');
        if (el) {
            el.textContent = formatTotalTime(rawTotal);
        }
    }

    /* =====================================================
       PIN ACCESS (888 / 72 HOURS VALIDITY)
       ===================================================== */
    var UNLOCK_KEY = 'prana_unlocked_until';
    var THREE_DAYS_MS = 3 * 24 * 60 * 60 * 1000; // 72 hours
    var enteredPin = '';

    function isPranaUnlocked() {
        try {
            var rawUntil = localStorage.getItem(UNLOCK_KEY);
            if (!rawUntil) return false;
            var until = parseInt(rawUntil, 10);
            if (isNaN(until)) return false;
            return Date.now() < until;
        } catch(e) {
            return false;
        }
    }

    function handleLotusClick() {
        if (isPranaUnlocked()) {
            window.location.href = 'pranayama.html';
        } else {
            openPinModal();
        }
    }

    function openPinModal() {
        enteredPin = '';
        renderPinDots();
        var modal = document.getElementById('pinModal');
        if (modal) modal.classList.add('open');
    }

    function closePinModal(e) {
        if (e && e.target !== e.currentTarget && !e.target.classList.contains('pin-close-btn')) return;
        var modal = document.getElementById('pinModal');
        if (modal) modal.classList.remove('open');
        enteredPin = '';
    }

    function pressPin(digit) {
        if (enteredPin.length >= 3) return;
        enteredPin += digit;
        renderPinDots();

        if (enteredPin.length === 3) {
            setTimeout(checkPin, 120);
        }
    }

    function backspacePin() {
        if (enteredPin.length > 0) {
            enteredPin = enteredPin.slice(0, -1);
            renderPinDots();
        }
    }

    function clearPin() {
        enteredPin = '';
        renderPinDots();
    }

    function renderPinDots() {
        for (var i = 0; i < 3; i++) {
            var dot = document.getElementById('dot' + i);
            if (dot) {
                if (i < enteredPin.length) {
                    dot.classList.add('filled');
                    dot.classList.remove('error');
                } else {
                    dot.classList.remove('filled', 'error');
                }
            }
        }
    }

    function checkPin() {
        if (enteredPin === '888') {
            // Success: save unlock timestamp for exactly 3 days
            var unlockUntil = Date.now() + THREE_DAYS_MS;
            localStorage.setItem(UNLOCK_KEY, unlockUntil.toString());
            showToast('Доступ открыт ✨');

            setTimeout(function() {
                var modal = document.getElementById('pinModal');
                if (modal) modal.classList.remove('open');
                window.location.href = 'pranayama.html';
            }, 250);
        } else {
            // Wrong code: shake and clear
            for (var i = 0; i < 3; i++) {
                var dot = document.getElementById('dot' + i);
                if (dot) dot.classList.add('error');
            }
            var card = document.querySelector('.pin-card');
            if (card) {
                card.classList.add('shake');
                setTimeout(function() {
                    card.classList.remove('shake');
                    clearPin();
                }, 400);
            }
        }
    }

    // Keyboard support
    window.addEventListener('keydown', function(e) {
        var modal = document.getElementById('pinModal');
        if (!modal || !modal.classList.contains('open')) return;
        if (e.key >= '0' && e.key <= '9') {
            pressPin(e.key);
        } else if (e.key === 'Backspace') {
            backspacePin();
        } else if (e.key === 'Escape') {
            closePinModal();
        }
    });

    function showToast(msg) {
        var t = document.getElementById('toast');
        if (!t) return;
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(function() { t.classList.remove('show'); }, 1600);
    }

    /* =====================================================
       LIFECYCLE & SERVICE WORKER
       ===================================================== */
    window.addEventListener('pageshow', function() {
        renderTotalTimer();
    });

    document.addEventListener('DOMContentLoaded', function() {
        renderTotalTimer();
