<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.30"/>
      <stop offset="35%" stop-color="#d4af37" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#9a7b1c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0e0d0a" stop-opacity="0"/>
    </radialGradient>

    <!-- Golden Filament Gradient -->
    <linearGradient id="goldFilament" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#f5d565"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>

    <!-- Outer Bloom Filter -->
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Warm Obsidian Canvas -->
  <rect width="512" height="512" rx="112" fill="#0e0d0a"/>

  <!-- Ambient Light from Lamp -->
  <circle cx="256" cy="256" r="240" fill="url(#lampGlow)"/>

  <!-- Glowing Letter M (Lamp Effect) -->
  <g filter="url(#bloom)" text-anchor="middle">
    <!-- Outer Glow Silhouette -->
    <text x="256" y="375" font-family="'Georgia', 'Times New Roman', serif" font-weight="bold" font-size="340" fill="#d4af37" opacity="0.6">M</text>
    <!-- Core Luminous Filament -->
    <text x="256" y="375" font-family="'Georgia', 'Times New Roman', serif" font-weight="bold" font-size="340" fill="url(#goldFilament)">M</text>
  </g>
</svg>
