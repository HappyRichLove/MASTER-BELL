<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#2a1e08" stop-opacity="1"/>
      <stop offset="35%" stop-color="#18130a" stop-opacity="1"/>
      <stop offset="70%" stop-color="#0e0d0c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#070708" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="lampHalo" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b1"/>
      <feGaussianBlur stdDeviation="6" result="b2"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with warm ambient lamp glow -->
  <rect width="512" height="512" fill="url(#bgGlow)"/>
  <rect width="512" height="512" fill="url(#lampHalo)"/>

  <!-- Glowing aura behind the letter -->
  <text x="256" y="366" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif" 
        font-size="310" 
        font-weight="300" 
        fill="#d4af37" 
        opacity="0.8" 
        filter="url(#softGlow)">М</text>

  <!-- Golden warm body from the exact font of the header -->
  <text x="256" y="366" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif" 
        font-size="310" 
        font-weight="300" 
        fill="#f5d77f">М</text>

  <!-- Incandescent filament center highlights -->
  <text x="256" y="366" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif" 
        font-size="310" 
        font-weight="300" 
        fill="#fff8e7" 
        opacity="0.85">М</text>
</svg>