<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-title" content="MASTER">
    <title>MASTER — Метроном</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">

    <style>
        *, *::before, *::after { box-sizing: border-box; }
        :root {
            --bg: #000000;
            --surface: #141416;
            --text: #ffffff;
            --accent: #8e8e93;
            --gold: #d4af37;
            --glow: rgba(212, 175, 55, 0.45);
            --border: rgba(212, 175, 55, 0.22);
        }

        body {
            position: relative;
            margin: 0;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .master-title {
            font-size: clamp(2rem, 7.5vw, 3.2rem);
            font-weight: 200;
            letter-spacing: 0.32em;
            text-indent: 0.32em;
            color: var(--text);
            opacity: 0.95;
            margin: 0;
            text-transform: uppercase;
            text-align: center;
            white-space: nowrap;
            line-height: 1;
            padding-top: max(20px, 4vh);
            padding-bottom: max(20px, 4vh);
        }

        .back-btn {
            position: absolute;
            top: calc(env(safe-area-inset-top, 20px) + 10px);
            left: max(16px, env(safe-area-inset-left, 16px));
            z-index: 99999;
            color: var(--accent);
            opacity: 0.85;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            transition: opacity 0.2s, transform 0.15s, background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(212, 175, 55, 0.15);
        }
        .back-btn:active {
            opacity: 1;
            transform: scale(0.92);
            background: rgba(212, 175, 55, 0.15);
        }

        .timer-display {
            font-size: clamp(4.5rem, 18vw, 6.5rem);
            font-weight: 100;
            font-variant-numeric: tabular-nums;
            color: var(--gold);
            letter-spacing: -0.02em;
            text-shadow: 0 0 10px transparent;
            transition: transform 0.2s, text-shadow 0.2s, opacity 0.2s;
            cursor: pointer;
            line-height: 1;
        }
        .timer-display.pulse {
            transform: scale(1.05);
            text-shadow: 0 0 25px var(--glow);
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 5vh;
            width: 100%;
            max-width: 400px;
        }

        .secondary-btns {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 10px;
            align-items: center;
        }

        .icon-btn {
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            color: var(--text);
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .icon-btn:active {
            transform: scale(0.9);
            border-color: var(--border);
        }

        .btn-main {
            background: var(--gold);
            border: none;
            padding: 18px 0;
            border-radius: 40px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1.2rem;
            font-weight: 800;
            color: #000000;
            box-shadow: 0 8px 25px var(--glow);
            width: 220px;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-main:active {
            transform: scale(0.95);
        }

        .bottom-stats {
            position: absolute;
            bottom: max(20px, calc(10px + env(safe-area-inset-bottom, 0px)));
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.7;
        }
        .stat-label {
            font-size: 0.62rem;
            font-weight: 800;
            letter-spacing: 0.15em;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="back-btn" onclick="window.location.href='index.html'" title="Назад в хаб">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
    </div>

    <div class="master-title">МАСТЕР</div>
    <div class="timer-display" id="display" onclick="handleStart(event)">00:00</div>

    <div class="controls">
        <div class="secondary-btns">
            <!-- Reset current session -->
            <button id="resetBtn" class="icon-btn" onclick="handleReset(event)" title="Сбросить текущий счетчик">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                    <path d="M3 3v5h5"></path>
                </svg>
            </button>
        </div>
        <button id="startBtn" class="btn-main" onclick="handleStart(event)">СТАРТ</button>
    </div>

    <div class="bottom-stats">
        <div class="stat-label">ОБЩЕЕ ВРЕМЯ</div>
        <div class="stat-value" id="totalMinutes">0 мин</div>
    </div>

<script>
    document.addEventListener('touchstart', function(e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturestart', function(e) { e.preventDefault(); });

    var els = {
        display: document.getElementById('display'),
        startBtn: document.getElementById('startBtn'),
        totalMins: document.getElementById('totalMinutes')
    };

    var state = { running: false, sec: 0, totalGlobalSec: 0, nextTick: 0 };
    var audio = null;

    function formatMMSS(s) {
        var m = Math.floor(s / 60), sec = s % 60;
        return (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    var masterGain = null;
    var masterCompressor = null;

    function initAudio() { 
        if (!audio) {
            audio = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audio.createGain();
            masterGain.gain.value = 0.85;

            masterCompressor = audio.createDynamicsCompressor();
            masterCompressor.threshold.setValueAtTime(-2, audio.currentTime);
            masterCompressor.knee.setValueAtTime(6, audio.currentTime);
            masterCompressor.ratio.setValueAtTime(10, audio.currentTime);
            masterCompressor.attack.setValueAtTime(0.003, audio.currentTime);
            masterCompressor.release.setValueAtTime(0.15, audio.currentTime);

            masterGain.connect(masterCompressor);
            masterCompressor.connect(audio.destination);
        }
        if (audio.state === 'suspended') audio.resume(); 
    }

    function playTick(volScale) {
        try {
            if (!audio) return;
            var scale = (typeof volScale === 'number' && isFinite(volScale) && volScale > 0) ? volScale : 1.0;
            var t0 = audio.currentTime;

            // Crisp, organic temple wood / bamboo click (warm, distinct, non-fatiguing)
            var osc = audio.createOscillator();
            var subOsc = audio.createOscillator();
            var gain = audio.createGain();
            var subGain = audio.createGain();
            var lp = audio.createBiquadFilter();

            // Primary wooden resonant tone: 820 Hz -> 520 Hz rapid drop (24ms)
            osc.type = 'sine';
            osc.frequency.setValueAtTime(820, t0);
            osc.frequency.exponentialRampToValueAtTime(520, t0 + 0.024);

            // Acoustic chamber warmth: 380 Hz -> 240 Hz rapid drop (24ms)
            subOsc.type = 'sine';
            subOsc.frequency.setValueAtTime(380, t0);
            subOsc.frequency.exponentialRampToValueAtTime(240, t0 + 0.024);

            // Resonant lowpass filter at 1600 Hz (Q=1.2) — cuts harsh 2-5 kHz treble spikes, 100% gentle on ears
            lp.type = 'lowpass';
            lp.frequency.setValueAtTime(1600, t0);
            lp.Q.setValueAtTime(1.2, t0);

            // Envelopes: snappy 1.8ms attack (no digital click) + organic exponential decay
            var peakMain = 0.22 * scale;
            var peakSub = 0.08 * scale;

            gain.gain.setValueAtTime(0.0001, t0);
            gain.gain.linearRampToValueAtTime(peakMain, t0 + 0.0018);
            gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.040);

            subGain.gain.setValueAtTime(0.0001, t0);
            subGain.gain.linearRampToValueAtTime(peakSub, t0 + 0.002);
            subGain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.030);

            osc.connect(gain);
            subOsc.connect(subGain);
            gain.connect(lp);
            subGain.connect(lp);
            lp.connect(masterGain || audio.destination);

            osc.start(t0);
            subOsc.start(t0);
            osc.stop(t0 + 0.045);
            subOsc.stop(t0 + 0.035);

            osc.onended = function() {
                try {
                    osc.disconnect();
                    subOsc.disconnect();
                    gain.disconnect();
                    subGain.disconnect();
                    lp.disconnect();
                } catch(e){}
            };
        } catch (e) {}
    }

    function engine(now) {
        if (!state.running) return;
        if (now - state.nextTick > 2000) {
            // Skipped while in background — catch up without machine-gun stutter
            state.nextTick = now;
        }
        if (now >= state.nextTick) {
            state.sec++;
            state.totalGlobalSec++;
            els.display.textContent = formatMMSS(state.sec);
            els.display.classList.add('pulse');
            setTimeout(function(){ els.display.classList.remove('pulse'); }, 150);
            playTick();
            
            if (state.totalGlobalSec % 10 === 0) {
                localStorage.setItem('mb_total', state.totalGlobalSec);
                updateTotalMins();
            }
            state.nextTick += 1000;
        }
        requestAnimationFrame(engine);
    }

    function handleStart(e) {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        initAudio();
        if (!state.running) {
            state.running = true; els.startBtn.textContent = 'ПАУЗА';
            requestWakeLock();
            state.nextTick = performance.now() + 1000;
            requestAnimationFrame(engine);
            els.display.classList.add('pulse'); setTimeout(function(){ els.display.classList.remove('pulse'); }, 150);
            playTick();
        } else {
            state.running = false; els.startBtn.textContent = 'ПРОДОЛЖИТЬ';
            releaseWakeLock();
            localStorage.setItem('mb_total', state.totalGlobalSec);
            updateTotalMins();
        }
    }

    function handleReset(e) { 
        if (e) { e.preventDefault(); e.stopPropagation(); } 
        state.running = false; els.startBtn.textContent = 'СТАРТ'; 
        state.sec = 0; els.display.textContent = '00:00'; 
        releaseWakeLock(); 
    }

    function updateTotalMins() {
        var mins = Math.floor(state.totalGlobalSec / 60);
        els.totalMins.textContent = mins + ' мин';
    }

    var wakeLock = null;
    function requestWakeLock() { if ('wakeLock' in navigator) { navigator.wakeLock.request('screen').then(function(wl) { wakeLock = wl; }).catch(function(){}); } }
    function releaseWakeLock() { if (wakeLock) { wakeLock.release().catch(function(){}); wakeLock = null; } }

    try {
        state.totalGlobalSec = parseInt(localStorage.getItem('mb_total')) || 0;
        updateTotalMins();
    } catch(e){}

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js?v=1.0.5').then(function(reg) {
            reg.update();
        }).catch(function(){});
    }
</script>
</body>
</html>
